<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horse Skeleton Viewer</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="page-enter">
<div id="container">
  <div id="sidebar">
    <h2>Bone List</h2>
    <ul id="boneList"></ul>
    <div id="boneInfo"><b>Select a bone from the list</b></div>
  </div>
  <div id="viewer">
    <div id="viewerTop">
      <button id="backButton" type="button">🔙 Back</button>
    </div>
    <div id="extraInfo" class="hidden"></div>
  </div>
</div>


<!-- Three.js Libraries -->

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

<!-- JS الخاص بالمشروع -->
<script src="script.js"></script>
<script src="tr.js"></script>
<script src="enhancer.js"></script>
  <script src="enhancer2.js"></script>
  <script src="mobile-effects.js"></script>

</html>
