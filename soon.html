<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon</title>
  <style>
    /* إعدادات أساسية */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 50%, #000010, #000000 70%);
      overflow: hidden;
      position: relative;
      font-family: 'Poppins', 'Segoe UI', sans-serif;
    }

    /* خلفية متحركة */
    body::before {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg, #1e90ff, #00bfff, #1e90ff);
      filter: blur(150px);
      animation: rotateBg 15s linear infinite;
      opacity: 0.2;
    }

    @keyframes rotateBg {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* النص */
    h1 {
      font-size: 80px;
      color: #1e90ff;
      text-transform: uppercase;
      letter-spacing: 10px;
      text-shadow: 
        0 0 20px rgba(30, 144, 255, 0.8),
        0 0 40px rgba(30, 144, 255, 0.6),
        0 0 60px rgba(30, 144, 255, 0.4);
      animation: glow 2.5s infinite ease-in-out, float 5s infinite ease-in-out;
      z-index: 2;
    }

    /* توهج النص */
    @keyframes glow {
      0%, 100% {
        text-shadow:
          0 0 15px rgba(30,144,255,0.7),
          0 0 30px rgba(30,144,255,0.5),
          0 0 60px rgba(30,144,255,0.3);
        transform: scale(1);
      }
      50% {
        text-shadow:
          0 0 30px rgba(30,144,255,1),
          0 0 60px rgba(30,144,255,0.9),
          0 0 90px rgba(30,144,255,0.8);
        transform: scale(1.05);
      }
    }

    /* حركة طفو خفيفة للنص */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    /* لمسة إضافية حول النص */
    .circle {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      border: 3px solid rgba(30,144,255,0.4);
      animation: spin 10s linear infinite;
      z-index: 1;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

  </style>
</head>
<body>
  <div class="circle"></div>
  <h1>SOON</h1>
</body>
</html>
