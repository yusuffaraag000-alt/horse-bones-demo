<!DOCTYPE html>
<html lang="ar">
<head>
    <link rel="stylesheet" href="styles.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    body {
   
      display: flex;
      height: 100vh;
      justify-content: center;
      align-items: center;
      font-family: "Tajawal", sans-serif;
    }
    .login-box {
      background: rgb(3, 1, 1);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 0 15px rgba(8, 92, 160, 0.1);
      text-align: center;
      width: 300px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      background: #166ea1;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #1b5e20;
    }
    p { color: red; font-size: 14px; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>🔒Password please</h2>
    <input type="password" id="password" placeholder="Password">
    <button onclick="checkPassword()">Enter</button>
    <p id="error"></p>
  </div>

  <script>
    const PASSWORD = "207"; // ← دي كلمة السر يا صديقي اكتبها وادخل
    function checkPassword() {
      const input = document.getElementById("password").value;
      if (input === PASSWORD) {
        // لو الكلمة صحيحة، يدخل على الموقع
        window.location.href = "index3.html"; // ← اسم الصفحة الرئيسية
      } else {
        document.getElementById("error").textContent = "❌ كلمة السر غلط";
      }
    }
  </script>
</body>
</html>
