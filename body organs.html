<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruminant Stomach - Science View</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: radial-gradient(circle at center, #0a0a0a 0%, #000000 100%);
      border: 3px solid #00bfff;
      box-shadow: 0 0 40px rgba(0, 191, 255, 0.4);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #e6f7ff;
      text-align: center;
      transition: background 0.5s ease-in-out;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 30px;
      color: #00bfff;
      text-shadow: 0 0 15px rgba(0, 191, 255, 0.6);
      letter-spacing: 1px;
      animation: fadeIn 2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    button {
      background: linear-gradient(90deg, #00bfff, #1e90ff);
      color: #fff;
      padding: 15px 40px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 1px;
      box-shadow: 0 0 25px rgba(30, 144, 255, 0.5);
      transition: transform 0.25s ease, box-shadow 0.3s ease;
    }

    button:hover{
      transform: scale(1.08);
      box-shadow: 0 0 35px rgba(0, 191, 255, 0.8);
    }

    footer {
      position: absolute;
      bottom: 20px;
      color: #0099cc;
      font-size: 0.9rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <h1>Scientific 3D Visualization: digestive and respiratory system</h1>

  <button id="openLinkButton">Open 3D Model</button>

  <footer>© 2025 Scientific Visualization Lab</footer>

  <script>
    const myLink = "https://sketchfab.com/vetanat.uzh/collections/digestive-and-respiratory-systems-348ce7d5fe5a452fb9a0d9e9a0005602";
    document.getElementById("openLinkButton").onclick = function() {
      window.open(myLink, "_blank");
    };
  </script>
  <script src="enhancer.js"></script>
  <script src="mobile-effects.js"></script>


</body>
</html>
